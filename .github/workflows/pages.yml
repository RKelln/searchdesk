# Publishes the built single file to GitHub Pages on the custom domain (DESIGN 14).
# The maintainer's one-time steps (Pages source = GitHub Actions, DNS) are in the T4.2 notes.
name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the build names the version from the latest tag
          fetch-tags: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v7
      - name: Unit tests
        run: |
          node --test tests/unit/*.test.js
          uv run tests/unit/test_build.py
      - name: Feature checks
        # Every check file has to pass on its own, or a broken feature can still reach the build.
        # Plain parameter expansion only, so it stays safe in bash 3.2 and on a Mac.
        run: |
          node checks/run.js example
          for f in checks/*.check.js; do
            id="${f#checks/}"
            node checks/run.js "${id%.check.js}"
          done
      - name: Build
        run: uv run tools/build.py --cname searchdesk.ryankelln.com
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
