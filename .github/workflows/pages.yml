# Publishes the built single file to GitHub Pages on the custom domain (DESIGN 14).
# The maintainer's one-time steps (Pages source = GitHub Actions, DNS) are in the T4.2 notes.
name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the build names the version from the latest tag
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v5
      - name: Unit tests
        run: |
          node --test tests/unit/*.test.js
          uv run tests/unit/test_build.py
      - name: Build
        run: uv run tools/build.py --cname searchdesk.ryankelln.com
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
